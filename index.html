<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Inteligente Pro</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2e7d32; --bg: #f8f9fa; --danger: #d32f2f; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        .app-bar { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top:0; z-index:10; }
        .view { display: none; padding: 15px; }
        .view.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1rem; margin-top: 10px; font-weight: bold; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 65px; }
        .nav-item { flex: 1; border: none; background: none; padding: 10px; color: #757575; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; }
        
        /* Estilos Formulario */
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; color: #444; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        #api-loading { display: none; color: #1565c0; font-weight: bold; text-align: center; padding: 10px; }
        #current-photo-preview { width: 100%; max-height: 200px; object-fit: contain; background: #eee; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>

    <div class="app-bar">📦 Gestor de Despensa</div>

    <!-- BODEGA -->
    <section id="view-home" class="view active">
        <h3 style="margin-top:0;">Mi Inventario</h3>
        <div id="inventory-list"></div>
    </section>

    <!-- AGREGAR -->
    <section id="view-add" class="view">
        <div class="card">
            <h3 style="margin-top:0;">Registrar Compra</h3>
            
            <label>Código de Barras</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="barcode" placeholder="Escanear o escribir...">
                <button onclick="startScanner()" style="padding:10px 20px; background:#1565c0; color:white; border:none; border-radius:8px;"><i class="fas fa-camera"></i></button>
            </div>
            
            <div id="api-loading"><i class="fas fa-sync fa-spin"></i> Buscando producto...</div>

            <label>Nombre del Producto *</label>
            <input type="text" id="notes" placeholder="Ej: Arroz 1kg">

            <label>Fecha de Vencimiento *</label>
            <input type="date" id="expiryDate">

            <label>Foto del Producto *</label>
            <img id="current-photo-preview" src="">
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="margin-top:10px;">
            
            <button class="btn-main" onclick="saveProduct()">GUARDAR EN BODEGA</button>
        </div>
    </section>

    <!-- ALERTAS -->
    <section id="view-alerts" class="view">
        <h3>🚨 Próximos a Vencer</h3>
        <div id="alerts-list"></div>
    </section>

    <!-- DETALLE -->
    <section id="view-detail" class="view">
        <button onclick="showView('home')" style="border:none; background:none; color:var(--primary); font-weight:bold; padding:10px 0;"><i class="fas fa-arrow-left"></i> VOLVER</button>
        <div id="detail-content" class="card"></div>
    </section>

    <!-- ESCANER -->
    <div id="scanner-container" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:200;">
        <div id="reader"></div>
        <button onclick="stopScanner()" style="width:100%; padding:20px; background:var(--danger); color:white; border:none; font-weight:bold;">CANCELAR</button>
    </div>

    <!-- MENU -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('home')"><i class="fas fa-warehouse"></i>Bodega</button>
        <button class="nav-item" onclick="showView('add')"><i class="fas fa-plus-circle"></i>Agregar</button>
        <button class="nav-item" onclick="showView('alerts')"><i class="fas fa-bell"></i>Alertas</button>
    </nav>

    <script>
        let db;
        const html5QrCode = new Html5Qrcode("reader");
        const PLACEHOLDER = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="; // Transparente

        // Inicializar preview vacío al cargar
        document.getElementById('current-photo-preview').src = PLACEHOLDER;

        // --- MANEJO DE VISTA PREVIA DE FOTO ---
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('current-photo-preview').src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Base de Datos
        const request = indexedDB.open("DespensaSmartDB", 3);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if(!db.objectStoreNames.contains("inventory")) db.createObjectStore("inventory", { keyPath: "id", autoIncrement: true });
            if(!db.objectStoreNames.contains("product_master")) db.createObjectStore("product_master", { keyPath: "barcode" });
        };
        request.onsuccess = e => { db = e.target.result; renderInventory(); };

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            if(viewId === 'home') renderInventory();
            if(viewId === 'alerts') checkAlerts();
        }

        async function fetchProductInfo(barcode) {
            const loading = document.getElementById('api-loading');
            loading.style.display = 'block';
            
            // 1. Memoria Local
            const tx = db.transaction("product_master", "readonly");
            const store = tx.objectStore("product_master");
            const localData = await new Promise(res => {
                const req = store.get(barcode);
                req.onsuccess = () => res(req.result);
            });

            if (localData) {
                document.getElementById('notes').value = localData.name;
                document.getElementById('current-photo-preview').src = localData.photo;
                loading.style.display = 'none';
                return;
            }

            // 2. Nube
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const data = await res.json();
                if (data.status === 1) {
                    const p = data.product;
                    document.getElementById('notes').value = p.product_name || "";
                    if(p.image_url) document.getElementById('current-photo-preview').src = p.image_url;
                }
            } catch (e) { console.log("Error API"); }
            
            loading.style.display = 'none';
        }

        function saveProduct() {
            const barcode = document.getElementById('barcode').value;
            const name = document.getElementById('notes').value;
            const expiry = document.getElementById('expiryDate').value;
            const currentPreview = document.getElementById('current-photo-preview').src;

            // VALIDACIÓN ESTRICTA
            if (!name) return Swal.fire('Falta Nombre', 'Ingresa el nombre del producto', 'error');
            if (!expiry) return Swal.fire('Falta Fecha', 'Selecciona la fecha de vencimiento', 'error');
            if (currentPreview === PLACEHOLDER || !currentPreview) return Swal.fire('Falta Foto', 'Debes tomar una foto del producto', 'error');

            const tx = db.transaction(["inventory", "product_master"], "readwrite");
            
            // Guardar en inventario
            tx.objectStore("inventory").add({
                barcode, name, expiry, photo: currentPreview, date: new Date().toLocaleDateString()
            });

            // Guardar/Actualizar Memoria
            tx.objectStore("product_master").put({
                barcode, name, photo: currentPreview
            });

            tx.oncomplete = () => {
                Swal.fire('¡Éxito!', 'Producto registrado', 'success');
                limpiarFormulario();
                showView('home');
            };
        }

        function limpiarFormulario() {
            document.getElementById('barcode').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('photo-input').value = '';
            document.getElementById('current-photo-preview').src = PLACEHOLDER;
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = "";
            db.transaction("inventory").objectStore("inventory").openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const p = cursor.value;
                    list.innerHTML += `
                        <div class="card" onclick="openDetail(${p.id})">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <img src="${p.photo}" class="thumb">
                                <div><strong style="font-size:1rem;">${p.name}</strong><br><small>📅 Vence: ${p.expiry}</small></div>
                            </div>
                        </div>`;
                    cursor.continue();
                }
            };
        }

        function openDetail(id) {
            db.transaction("inventory").objectStore("inventory").get(id).onsuccess = e => {
                const p = e.target.result;
                document.getElementById('detail-content').innerHTML = `
                    <img src="${p.photo}" style="width:100%; border-radius:10px; max-height:250px; object-fit:contain;">
                    <h2 style="margin:15px 0 5px 0;">${p.name}</h2>
                    <p><b>Código:</b> ${p.barcode || 'N/A'}</p>
                    <p><b>Compra:</b> ${p.date}</p>
                    <p style="color:var(--danger); font-size:1.2rem;"><b>Vence:</b> ${p.expiry}</p>
                    <button class="btn-main" style="background:var(--danger)" onclick="deleteItem(${p.id})">🗑️ DESECHAR / CONSUMIDO</button>
                `;
                showView('detail');
            };
        }

        function deleteItem(id) {
            Swal.fire({
                title: '¿Confirmar?',
                text: "Se eliminará de la bodega",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Eliminar',
                confirmButtonColor: '#d32f2f'
            }).then(res => {
                if(res.isConfirmed) {
                    db.transaction("inventory", "readwrite").objectStore("inventory").delete(id);
                    showView('home');
                }
            });
        }

        function checkAlerts() {
            const list = document.getElementById('alerts-list'); list.innerHTML = "";
            const today = new Date();
            db.transaction("inventory").objectStore("inventory").openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if (cursor) {
                    const p = cursor.value;
                    const diff = (new Date(p.expiry) - today) / (1000*60*60*24);
                    if (diff <= 3) {
                        list.innerHTML += `<div class="card" style="border-left:6px solid ${diff<0?'red':'orange'}" onclick="openDetail(${p.id})">
                            <b style="color:${diff<0?'red':'#e67e22'}">${diff<0?'🚨 PRODUCTO VENCIDO':'⏳ VENCE PRONTO'}</b><br>${p.name} (${p.expiry})</div>`;
                    }
                    cursor.continue();
                }
            };
        }

        function startScanner() {
            document.getElementById('scanner-container').style.display='block';
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                text => { 
                    document.getElementById('barcode').value = text; 
                    stopScanner(); 
                    fetchProductInfo(text); 
                }
            );
        }
        function stopScanner() { html5QrCode.stop(); document.getElementById('scanner-container').style.display='none'; }
    </script>
</body>
</html>
