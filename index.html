<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Inteligente Pro</title>
    <link rel="manifest" href="manifest.json">
    <!-- Librerías Externas -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #2e7d32; --bg: #f8f9fa; --danger: #d32f2f; --info: #0277bd; --warning-5d: #fdd835; --warning-3d: #fb8c00; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; }
        .app-bar { background: var(--primary); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top:0; z-index:100; display: flex; justify-content: space-between; align-items: center; }
        .view { display: none; padding: 15px; animation: fadeIn 0.2s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1rem; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .btn-ocr { background: var(--info); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
        .btn-barcode { background: #1565c0; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        
        #current-photo-preview { width: 100%; max-height: 200px; object-fit: contain; background: #eee; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; display: block; }
        #ocr-status { display: none; color: var(--info); font-weight: bold; text-align: center; margin-top: 5px; font-size: 0.8rem; }
        
        /* Estilos de Alertas Solicitados */
        .alert-item { cursor: pointer; transition: transform 0.1s; border-radius: 12px; }
        .alert-item:active { transform: scale(0.98); }
        .alert-vencido { border-left: 8px solid var(--danger) !important; background: #ffebee !important; } /* Rojo */
        .alert-3dias { border-left: 8px solid var(--warning-3d) !important; background: #fff3e0 !important; }   /* Naranja */
        .alert-5dias { border-left: 8px solid var(--warning-5d) !important; background: #fffde7 !important; }   /* Amarillo */

        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 65px; z-index: 100; }
        .nav-item { flex: 1; border: none; background: none; padding: 10px; color: #757575; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 3px; }

        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.85rem; color: #444; }
        
        #scanner-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; }
        #reader { width: 100%; height: 80%; }
    </style>
</head>
<body>

    <div class="app-bar">
        <span>📦 Mi Despensa Pro</span>
        <div style="display: flex; gap: 15px;">
            <i class="fas fa-file-export" onclick="exportData()" title="Exportar Backup"></i>
            <i class="fas fa-file-import" onclick="document.getElementById('import-input').click()" title="Importar Backup"></i>
            <input type="file" id="import-input" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>

    <!-- VISTA: BODEGA -->
    <section id="view-home" class="view active">
        <h3 style="margin-top:0;">Mi Inventario</h3>
        <div id="inventory-list"></div>
    </section>

    <!-- VISTA: AGREGAR -->
    <section id="view-add" class="view">
        <div class="card">
            <h3 style="margin-top:0;">Registrar Compra</h3>
            
            <label>Código de Barras</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="barcode" placeholder="Escanear...">
                <button class="btn-barcode" onclick="startScanner()"><i class="fas fa-barcode"></i></button>
            </div>

            <label>Foto del Producto *</label>
            <img id="current-photo-preview" src="">
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="margin-top:10px;">

            <label>Fecha de Vencimiento *</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="date" id="expiryDate">
                <button class="btn-ocr" onclick="document.getElementById('ocr-input').click()"><i class="fas fa-robot"></i> Leer</button>
            </div>
            <input type="file" id="ocr-input" accept="image/*" capture="environment" style="display: none;">
            <div id="ocr-status"><i class="fas fa-spinner fa-spin"></i> Analizando fecha...</div>

            <label>Nombre / Notas *</label>
            <input type="text" id="notes" placeholder="Ej: Arroz 1kg">
            
            <button class="btn-main" onclick="saveProduct()">GUARDAR EN BODEGA</button>
        </div>
    </section>

    <!-- VISTA: ALERTAS -->
    <section id="view-alerts" class="view">
        <h3>🚨 Alertas de Vencimiento</h3>
        <div id="alerts-list"></div>
    </section>

    <!-- VISTA: DETALLE -->
    <section id="view-detail" class="view">
        <button onclick="showView('home')" style="border:none; background:none; color:var(--primary); font-weight:bold; padding:10px 0;"><i class="fas fa-arrow-left"></i> VOLVER</button>
        <div id="detail-content" class="card"></div>
    </section>

    <!-- ESCANER QR -->
    <div id="scanner-container">
        <div id="reader"></div>
        <button onclick="stopScanner()" style="width:100%; padding:20px; background:var(--danger); color:white; border:none; font-weight:bold;">CANCELAR</button>
    </div>

    <!-- MENU INFERIOR -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('home')"><i class="fas fa-warehouse"></i>Bodega</button>
        <button class="nav-item" onclick="showView('add')"><i class="fas fa-plus-circle"></i>Agregar</button>
        <button class="nav-item" onclick="showView('alerts')"><i class="fas fa-bell"></i>Alertas</button>
    </nav>

    <script>
        let db;
        const html5QrCode = new Html5Qrcode("reader");
        const PLACEHOLDER = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        window.onload = () => {
            document.getElementById('current-photo-preview').src = PLACEHOLDER;
            initDB();
        };

        function initDB() {
            const request = indexedDB.open("DespensaSmartDB", 5); // Versión 5 para aplicar cambios
            request.onupgradeneeded = e => {
                db = e.target.result;
                if(!db.objectStoreNames.contains("inventory")) db.createObjectStore("inventory", { keyPath: "id", autoIncrement: true });
                if(!db.objectStoreNames.contains("product_master")) db.createObjectStore("product_master", { keyPath: "barcode" });
            };
            request.onsuccess = e => { db = e.target.result; renderInventory(); };
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            const btnIdx = {home: 0, add: 1, alerts: 2};
            if(viewId in btnIdx) document.querySelectorAll('.nav-item')[btnIdx[viewId]].classList.add('active');
            if(viewId === 'home') renderInventory();
            if(viewId === 'alerts') checkAlerts();
        }

        // --- MANEJO DE FOTOS ---
        document.getElementById('photo-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = ev => document.getElementById('current-photo-preview').src = ev.target.result;
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('ocr-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const status = document.getElementById('ocr-status');
                    status.style.display = 'block';
                    try {
                        const result = await Tesseract.recognize(event.target.result, 'eng+spa');
                        const detectedDate = parseDateFromText(result.data.text);
                        if (detectedDate) {
                            document.getElementById('expiryDate').value = detectedDate;
                            Swal.fire('¡Fecha Detectada!', detectedDate, 'success');
                        } else {
                            Swal.fire('No detectado', 'No se encontró una fecha clara.', 'info');
                        }
                    } catch (err) { Swal.fire('Error OCR', 'No se pudo procesar', 'error'); }
                    status.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function parseDateFromText(text) {
            text = text.toUpperCase();
            const regexes = [
                /\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{4})\b/,
                /\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{2})\b/,
                /\b(\d{2})[\/\-. ](\d{4})\b/
            ];
            for (let reg of regexes) {
                const match = text.match(reg);
                if (match) {
                    if (match.length === 3) return `${match[2].length === 2 ? "20"+match[2] : match[2]}-${match[1]}-01`;
                    if (match.length === 4) {
                        const y = match[3].length === 2 ? "20"+match[3] : match[3];
                        return `${y}-${match[2].padStart(2,'0')}-${match[1].padStart(2,'0')}`;
                    }
                }
            }
            return null;
        }

        // --- CORE LOGIC ---
        function saveProduct() {
            const barcode = document.getElementById('barcode').value;
            const name = document.getElementById('notes').value;
            const expiry = document.getElementById('expiryDate').value;
            const photo = document.getElementById('current-photo-preview').src;

            if (!name || !expiry || photo === PLACEHOLDER) {
                return Swal.fire('Faltan Datos', 'Nombre, Fecha y Foto son obligatorios', 'warning');
            }

            const tx = db.transaction(["inventory", "product_master"], "readwrite");
            tx.objectStore("inventory").add({ barcode, name, expiry, photo, date: new Date().toLocaleDateString() });
            tx.objectStore("product_master").put({ barcode, name, photo });

            tx.oncomplete = () => {
                Swal.fire('Guardado', '', 'success');
                limpiar();
                showView('home');
            };
        }

        function limpiar() {
            document.getElementById('barcode').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('current-photo-preview').src = PLACEHOLDER;
            document.getElementById('photo-input').value = '';
            document.getElementById('ocr-input').value = '';
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = "";
            if (!db) return;
            db.transaction("inventory").objectStore("inventory").openCursor().onsuccess = e => {
                const c = e.target.result;
                if (c) {
                    list.innerHTML += `
                        <div class="card" onclick="openDetail(${c.value.id})">
                            <div style="display:flex; gap:12px; align-items:center;">
                                <img src="${c.value.photo}" style="width:55px; height:55px; object-fit:cover; border-radius:8px;">
                                <div><strong>${c.value.name}</strong><br><small>📅 Vence: ${c.value.expiry}</small></div>
                            </div>
                        </div>`;
                    c.continue();
                } else if (list.innerHTML === "") {
                    list.innerHTML = "<p style='text-align:center; color:#888;'>Bodega vacía</p>";
                }
            };
        }

        function openDetail(id) {
            db.transaction("inventory").objectStore("inventory").get(id).onsuccess = e => {
                const p = e.target.result;
                document.getElementById('detail-content').innerHTML = `
                    <img src="${p.photo}" style="width:100%; border-radius:10px; max-height:300px; object-fit:contain;">
                    <h2 style="margin:15px 0 5px 0;">${p.name}</h2>
                    <p><b>Código:</b> ${p.barcode || 'N/A'}</p>
                    <p><b>Compra:</b> ${p.date}</p>
                    <p style="color:var(--danger); font-size:1.2rem;"><b>Vencimiento:</b> ${p.expiry}</p>
                    <button class="btn-main" style="background:var(--danger)" onclick="deleteItem(${p.id})">🗑️ DESECHAR</button>
                `;
                showView('detail');
            };
        }

        function deleteItem(id) {
            Swal.fire({ title: '¿Eliminar?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Sí' }).then(r => {
                if(r.isConfirmed) {
                    db.transaction("inventory", "readwrite").objectStore("inventory").delete(id);
                    showView('home');
                }
            });
        }

        // --- LÓGICA DE ALERTAS ACTUALIZADA ---
        function checkAlerts() {
            const list = document.getElementById('alerts-list'); 
            list.innerHTML = "";
            const today = new Date().setHours(0,0,0,0);
            
            if (!db) return;

            db.transaction("inventory").objectStore("inventory").openCursor().onsuccess = e => {
                const c = e.target.result;
                if (c) {
                    const p = c.value;
                    const expDate = new Date(p.expiry).setHours(0,0,0,0);
                    const diff = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));

                    let alertClass = "";
                    let alertText = "";

                    if (diff < 0) {
                        alertClass = "alert-vencido";
                        alertText = "🚨 PRODUCTO VENCIDO";
                    } else if (diff <= 3) {
                        alertClass = "alert-3dias";
                        alertText = "⚠️ VENCE EN 3 DÍAS O MENOS";
                    } else if (diff <= 5) {
                        alertClass = "alert-5dias";
                        alertText = "⏳ VENCE EN 5 DÍAS";
                    }

                    if (alertClass !== "") {
                        list.innerHTML += `
                            <div class="card alert-item ${alertClass}" onclick="openDetail(${p.id})">
                                <b style="font-size: 0.75rem;">${alertText}</b><br>
                                <span style="font-size: 1.1rem; font-weight: bold;">${p.name}</span><br>
                                <small>Fecha de vencimiento: ${p.expiry}</small>
                            </div>`;
                    }
                    c.continue();
                } else if (list.innerHTML === "") {
                    list.innerHTML = "<p style='text-align:center; color:#888;'>No hay alertas próximas</p>";
                }
            };
        }

        // --- BACKUP ---
        function exportData() {
            const tx = db.transaction(["inventory", "product_master"], "readonly");
            const data = {};
            tx.objectStore("inventory").getAll().onsuccess = e => {
                data.inventory = e.target.result;
                tx.objectStore("product_master").getAll().onsuccess = e2 => {
                    data.product_master = e2.target.result;
                    const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                    const a = document.createElement("a");
                    a.href = URL.createObjectURL(blob);
                    a.download = `backup_despensa.json`;
                    a.click();
                };
            };
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const data = JSON.parse(e.target.result);
                const tx = db.transaction(["inventory", "product_master"], "readwrite");
                if(data.inventory) data.inventory.forEach(i => { delete i.id; tx.objectStore("inventory").add(i); });
                if(data.product_master) data.product_master.forEach(m => tx.objectStore("product_master").put(m));
                tx.oncomplete = () => { Swal.fire('Backup Importado', '', 'success'); renderInventory(); };
            };
            reader.readAsText(file);
        }

        // --- BARRAS ---
        async function fetchProductInfo(barcode) {
            const tx = db.transaction("product_master", "readonly");
            const local = await new Promise(r => { 
                const g = tx.objectStore("product_master").get(barcode); 
                g.onsuccess = () => r(g.result); 
            });
            if (local) {
                document.getElementById('notes').value = local.name;
                document.getElementById('current-photo-preview').src = local.photo;
                return;
            }
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const d = await res.json();
                if (d.status === 1) {
                    document.getElementById('notes').value = d.product.product_name || "";
                    if(d.product.image_url) document.getElementById('current-photo-preview').src = d.product.image_url;
                }
            } catch(e) {}
        }

        function startScanner() {
            document.getElementById('scanner-container').style.display='block';
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                t => { document.getElementById('barcode').value = t; stopScanner(); fetchProductInfo(t); });
        }
        function stopScanner() { html5QrCode.stop(); document.getElementById('scanner-container').style.display='none'; }
    </script>
</body>
</html>
