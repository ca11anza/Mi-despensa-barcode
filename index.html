<!-- Agregamos los botones de Backup en la vista de Bodega -->
<section id="view-home" class="view active">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">Mi Inventario</h3>
        <div style="display: flex; gap: 10px;">
            <button onclick="exportData()" title="Exportar Copia" style="background:none; border:none; color:var(--primary); font-size:1.2rem;"><i class="fas fa-file-export"></i></button>
            <button onclick="document.getElementById('import-input').click()" title="Importar Copia" style="background:none; border:none; color:var(--info); font-size:1.2rem;"><i class="fas fa-file-import"></i></button>
            <input type="file" id="import-input" style="display:none" accept=".json" onchange="importData(event)">
        </div>
    </div>
    <div id="inventory-list" style="margin-top:15px;"></div>
</section>

<script>
    // --- NUEVA FUNCIÓN: EXPORTAR DATOS ---
    function exportData() {
        const transaction = db.transaction(["inventory", "product_master"], "readonly");
        const data = {};
        
        const store1 = transaction.objectStore("inventory");
        const store2 = transaction.objectStore("product_master");
        
        const req1 = store1.getAll();
        req1.onsuccess = () => {
            data.inventory = req1.result;
            const req2 = store2.getAll();
            req2.onsuccess = () => {
                data.product_master = req2.result;
                
                // Crear archivo descargable
                const blob = new Blob([JSON.stringify(data)], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `despensa_backup_${new Date().toLocaleDateString()}.json`;
                a.click();
                Swal.fire('Copia Creada', 'Guarda este archivo en un lugar seguro', 'success');
            }
        };
    }

    // --- NUEVA FUNCIÓN: IMPORTAR DATOS ---
    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                const tx = db.transaction(["inventory", "product_master"], "readwrite");
                
                if (data.inventory) {
                    data.inventory.forEach(item => {
                        delete item.id; // Evitar conflictos de ID
                        tx.objectStore("inventory").add(item);
                    });
                }
                
                if (data.product_master) {
                    data.product_master.forEach(item => {
                        tx.objectStore("product_master").put(item);
                    });
                }

                tx.oncomplete = () => {
                    Swal.fire('Importación Exitosa', 'Tu inventario se ha actualizado', 'success');
                    renderInventory();
                };
            } catch (err) {
                Swal.fire('Error', 'El archivo no es válido', 'error');
            }
        };
        reader.readAsText(file);
    }

    // --- MEJORA EN EL BUSCADOR DE FECHAS (OCR) ---
    // Agregamos detección de meses por nombre (ENE, FEB, etc)
    function parseDateFromText(text) {
        text = text.toUpperCase();
        const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC",
                        "ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
        
        // Primero intentamos la búsqueda numérica normal que ya teníamos
        const regexes = [
            /\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{4})\b/,
            /\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{2})\b/,
            /\b(\d{2})[\/\-. ](\d{4})\b/
        ];

        for (let reg of regexes) {
            const match = text.match(reg);
            if (match) {
                if (match.length === 3) return `${match[2].length === 2 ? "20"+match[2] : match[2]}-${match[1]}-01`;
                if (match.length === 4) return `${match[3].length === 2 ? "20"+match[3] : match[3]}-${match[2].padStart(2, '0')}-${match[1].padStart(2, '0')}`;
            }
        }

        // Búsqueda por nombre de mes (ej: 15 OCT 2026)
        for (let i = 0; i < months.length; i++) {
            if (text.includes(months[i])) {
                const monthNum = (i % 12 + 1).toString().padStart(2, '0');
                const yearMatch = text.match(/\b(20\d{2}|\d{2})\b/g);
                if (yearMatch) {
                    const year = yearMatch[yearMatch.length - 1];
                    const finalYear = year.length === 2 ? "20" + year : year;
                    return `${finalYear}-${monthNum}-01`;
                }
            }
        }
        return null;
    }
</script>
