<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Pro v16 - Auto-Recovery</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Librerías Externas -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #2e7d32; --bg: #f8f9fa; --danger: #d32f2f; --info: #0277bd; --warning-5d: #fdd835; --warning-3d: #fb8c00; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; overscroll-behavior: contain; }
        .app-bar { background: var(--primary); color: white; padding: 10px 15px; text-align: center; font-weight: bold; position: sticky; top:0; z-index:100; display: flex; justify-content: space-between; align-items: center; height: 50px; }
        .lang-select { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; border-radius: 5px; padding: 3px; font-size: 0.8rem; outline: none; }
        .view { display: none; padding: 15px; animation: fadeIn 0.2s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header { display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .badge-count { background: var(--primary); color: white; border-radius: 20px; padding: 2px 10px; font-size: 0.8rem; margin-left: auto; }
        .submenu-dates { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; display: none; flex-direction: column; gap: 8px; }
        .submenu-dates.active { display: flex; }
        .date-btn { background: #f0f0f0; border: none; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 0.9rem; cursor: pointer; border-left: 5px solid #ccc; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-size: 1rem; margin-top: 10px; font-weight: bold; cursor: pointer; }
        .btn-ocr { background: var(--info); color: white; border: none; padding: 10px; border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
        .btn-barcode { background: #1565c0; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
        #current-photo-preview { width: 100%; max-height: 200px; object-fit: contain; background: #eee; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; display: block; min-height: 100px; }
        #ocr-status { display: none; color: var(--info); font-weight: bold; text-align: center; margin-top: 5px; font-size: 0.8rem; }
        .alert-item { cursor: pointer; border-radius: 12px; border-left: 8px solid #ccc; margin-bottom: 10px; }
        .alert-vencido { border-left-color: var(--danger) !important; background: #ffebee !important; }
        .alert-3dias { border-left-color: var(--warning-3d) !important; background: #fff3e0 !important; }
        .alert-5dias { border-left-color: var(--warning-5d) !important; background: #fffde7 !important; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 65px; z-index: 100; }
        .nav-item { flex: 1; border: none; background: none; padding: 10px; color: #757575; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 1.3rem; margin-bottom: 3px; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.85rem; color: #444; }
        #scanner-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1000; }
        #reader { width: 100%; height: 80%; }
        #api-loading { display: none; text-align: center; color: var(--primary); padding: 5px; font-size: 0.8rem; }
        .qty-row { display: flex; align-items: center; gap: 10px; background: #e8f5e9; padding: 10px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="app-bar">
        <select class="lang-select" id="languageSelector" onchange="changeLanguage(this.value)">
            <option value="es">ES</option>
            <option value="en">EN</option>
        </select>
        <span id="txt-app-title">Mi Despensa Pro</span>
        <i class="fas fa-cog" onclick="showToolsMenu()" style="cursor:pointer; font-size: 1.3rem;"></i>
    </div>

    <!-- VISTAS -->
    <section id="view-home" class="view active">
        <h3 id="txt-inventory-title">Mi Inventario</h3>
        <div id="inventory-list"></div>
    </section>

    <section id="view-add" class="view">
        <div class="card">
            <h3 id="txt-add-title">Registrar Compra</h3>
            <label id="lbl-barcode">Código de Barras</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="barcode" placeholder="...">
                <button class="btn-barcode" onclick="startScanner()"><i class="fas fa-barcode"></i></button>
            </div>
            <div id="api-loading">...</div>
            
            <label id="lbl-photo">Foto del Producto *</label>
            <img id="current-photo-preview" src="">
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="margin-top:10px;">
            
            <label id="lbl-expiry">Fecha de Vencimiento *</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="date" id="expiryDate">
                <button class="btn-ocr" onclick="document.getElementById('ocr-input').click()"><i class="fas fa-robot"></i> <span id="txt-read">Leer</span></button>
            </div>
            <input type="file" id="ocr-input" accept="image/*" capture="environment" style="display: none;">
            <div id="ocr-status">...</div>

            <div class="qty-row">
                <label id="lbl-qty" style="margin:0; flex:1;">Cantidad:</label>
                <input type="number" id="regQty" value="1" min="1" style="width:70px; margin:0;">
            </div>

            <label id="lbl-notes">Nombre / Notas *</label>
            <input type="text" id="notes" placeholder="...">
            
            <button class="btn-main" onclick="saveProduct()" id="btn-save">GUARDAR EN BODEGA</button>
        </div>
    </section>

    <section id="view-alerts" class="view">
        <h3 id="txt-alerts-title">Alertas de Vencimiento</h3>
        <div id="alerts-list"></div>
    </section>

    <section id="view-detail" class="view">
        <button onclick="showView('home')" style="border:none; background:none; color:var(--primary); font-weight:bold; padding:10px 0;"><i class="fas fa-arrow-left"></i> <span id="txt-back">VOLVER</span></button>
        <div id="detail-content" class="card"></div>
    </section>

    <input type="file" id="import-excel-input" style="display:none" accept=".xlsx, .xls" onchange="importFromExcel(event)">
    <canvas id="compress-canvas" style="display:none;"></canvas>

    <div id="scanner-container">
        <div id="reader"></div>
        <button onclick="stopScanner()" style="width:100%; padding:20px; background:var(--danger); color:white; border:none; font-weight:bold;" id="btn-cancel-scan">CANCELAR</button>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showView('home')"><i class="fas fa-warehouse"></i><span id="nav-home">Bodega</span></button>
        <button class="nav-item" onclick="showView('add')"><i class="fas fa-plus-circle"></i><span id="nav-add">Agregar</span></button>
        <button class="nav-item" onclick="showView('alerts')"><i class="fas fa-bell"></i><span id="nav-alerts">Alertas</span></button>
    </nav>

    <script>
        const i18n = {
            es: {
                appTitle: "Mi Despensa Pro", inventoryTitle: "Mi Inventario", addTitle: "Registrar Compra",
                barcode: "Código de Barras", photo: "Foto del Producto *", expiry: "Fecha de Vencimiento *",
                read: "Leer", notes: "Nombre / Notas *", save: "GUARDAR EN BODEGA", alertsTitle: "Alertas de Vencimiento",
                back: "VOLVER", cancelScan: "CANCELAR", navHome: "Bodega", navAdd: "Agregar", navAlerts: "Alertas",
                emptyPantry: "Bodega vacía", noAlerts: "No hay alertas próximas", searchApi: "Buscando...",
                ocrStatus: "Analizando fecha...", success: "¡Éxito!", saved: "Producto registrado",
                missingData: "Faltan Datos", missingDataTxt: "Nombre, Fecha y Foto son requeridos.",
                qty: "Cantidad:", expired: "🚨 VENCIDO", expires3: "⚠️ VENCE PRONTO",
                expires5: "⏳ POR VENCER", units: "unid.", toolsTitle: "Herramientas",
                expExcel: "Exportar Excel", impExcel: "Importar Excel", genPdf: "Reporte PDF", available: "Disponibles", removeQty: "Cant. a borrar",
                details: { code: "Código", buy: "Compra", expiry: "Vencimiento", delete: "🗑️ ELIMINAR SELECCIONADOS" },
                pdf: { product: "Producto", barcode: "Código", expiry: "Vencimiento", qty: "Cant.", status: "Estado", expired: "VENCIDO", ok: "OK", title: "Reporte de Inventario" }
            },
            en: {
                appTitle: "My Pantry Pro", inventoryTitle: "My Inventory", addTitle: "Register Purchase",
                barcode: "Barcode", photo: "Product Photo *", expiry: "Expiry Date *",
                read: "Scan", notes: "Name / Notes *", save: "SAVE TO PANTRY", alertsTitle: "Expiry Alerts",
                back: "BACK", cancelScan: "CANCEL", navHome: "Pantry", navAdd: "Add", navAlerts: "Alerts",
                emptyPantry: "Pantry is empty", noAlerts: "No upcoming alerts", searchApi: "Searching...",
                ocrStatus: "Analyzing date...", success: "Success!", saved: "Product registered",
                missingData: "Missing Data", missingDataTxt: "Name, Date and Photo are required.",
                qty: "Quantity:", expired: "🚨 EXPIRED", expires3: "⚠️ EXPIRING SOON",
                expires5: "⏳ NEAR EXPIRY", units: "units", toolsTitle: "Tools",
                expExcel: "Export Excel", impExcel: "Import Excel", genPdf: "PDF Report", available: "Available", removeQty: "Qty to delete",
                details: { code: "Code", buy: "Bought", expiry: "Expiry", delete: "🗑️ REMOVE SELECTED" },
                pdf: { product: "Product", barcode: "Barcode", expiry: "Expiry", qty: "Qty", status: "Status", expired: "EXPIRED", ok: "OK", title: "Inventory Report" }
            }
        };

        let currentLang = localStorage.getItem('pantryLang') || 'es';
        function applyLanguage() {
            const t = i18n[currentLang];
            document.getElementById('txt-app-title').innerText = t.appTitle;
            document.getElementById('txt-inventory-title').innerText = t.inventoryTitle;
            document.getElementById('txt-add-title').innerText = t.addTitle;
            document.getElementById('lbl-barcode').innerText = t.barcode;
            document.getElementById('lbl-photo').innerText = t.photo;
            document.getElementById('lbl-expiry').innerText = t.expiry;
            document.getElementById('txt-read').innerText = t.read;
            document.getElementById('lbl-notes').innerText = t.notes;
            document.getElementById('btn-save').innerText = t.save;
            document.getElementById('txt-alerts-title').innerText = t.alertsTitle;
            document.getElementById('txt-back').innerText = t.back;
            document.getElementById('btn-cancel-scan').innerText = t.cancelScan;
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('nav-add').innerText = t.navAdd;
            document.getElementById('nav-alerts').innerText = t.navAlerts;
            document.getElementById('lbl-qty').innerText = t.qty;
            document.getElementById('languageSelector').value = currentLang;
        }

        function changeLanguage(lang) {
            currentLang = lang; localStorage.setItem('pantryLang', lang);
            applyLanguage(); renderInventory(); checkAlerts();
        }

        let db;
        const html5QrCode = new Html5Qrcode("reader");
        const PLACEHOLDER = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

        window.onload = () => {
            document.getElementById('current-photo-preview').src = PLACEHOLDER;
            applyLanguage(); initDB();
        };

        function initDB() {
            const request = indexedDB.open("DespensaSmartDB", 5);
            request.onsuccess = e => { db = e.target.result; renderInventory(); };
            request.onupgradeneeded = e => {
                db = e.target.result;
                if(!db.objectStoreNames.contains("inventory")) db.createObjectStore("inventory", { keyPath: "id", autoIncrement: true });
                if(!db.objectStoreNames.contains("product_master")) db.createObjectStore("product_master", { keyPath: "barcode" });
            };
        }

        // --- COMPRESIÓN DE IMAGEN ---
        async function compressImage(base64Str) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.getElementById('compress-canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                };
            });
        }

        document.getElementById('photo-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async ev => {
                    const compressed = await compressImage(ev.target.result);
                    document.getElementById('current-photo-preview').src = compressed;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('ocr-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    document.getElementById('ocr-status').style.display = 'block';
                    try {
                        const res = await Tesseract.recognize(event.target.result, 'eng+spa');
                        const d = parseDateFromText(res.data.text);
                        if (d) document.getElementById('expiryDate').value = d;
                    } catch (err) { console.error(err); }
                    document.getElementById('ocr-status').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        function parseDateFromText(text) {
            text = text.toUpperCase();
            const reg = [/\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{4})\b/, /\b(\d{2})[\/\-. ](\d{2})[\/\-. ](\d{2})\b/, /\b(\d{2})[\/\-. ](\d{4})\b/];
            for (let r of reg) {
                const m = text.match(r);
                if (m) {
                    if (m.length === 3) return `${m[2].length === 2 ? "20"+m[2] : m[2]}-${m[1]}-01`;
                    if (m.length === 4) {
                        const y = match[3].length === 2 ? "20"+match[3] : match[3];
                        return `${y}-${match[2].padStart(2,'0')}-${match[1].padStart(2,'0')}`;
                    }
                }
            }
            return null;
        }

        async function saveProduct() {
            const barcode = document.getElementById('barcode').value;
            const name = document.getElementById('notes').value;
            const expiry = document.getElementById('expiryDate').value;
            const photo = document.getElementById('current-photo-preview').src;
            const qty = parseInt(document.getElementById('regQty').value) || 1;
            const t = i18n[currentLang];
            if (!name || !expiry || photo === PLACEHOLDER) return Swal.fire(t.missingData, t.missingDataTxt, 'warning');
            const tx = db.transaction(["inventory", "product_master"], "readwrite");
            for(let i=0; i<qty; i++) { tx.objectStore("inventory").add({ barcode, name, expiry, photo, date: new Date().toLocaleDateString() }); }
            tx.objectStore("product_master").put({ barcode, name, photo });
            tx.oncomplete = () => {
                Swal.fire(t.success, t.saved, 'success');
                limpiar(); renderInventory();
            };
        }

        function limpiar() {
            document.getElementById('barcode').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('expiryDate').value = '';
            document.getElementById('regQty').value = '1';
            document.getElementById('current-photo-preview').src = PLACEHOLDER;
            document.getElementById('photo-input').value = '';
        }

        function getGroupedData(callback) {
            const products = {};
            const tx = db.transaction("inventory", "readonly");
            tx.objectStore("inventory").openCursor().onsuccess = e => {
                const c = e.target.result;
                if (c) {
                    const item = c.value;
                    const key = (item.barcode || item.name).trim();
                    if (!products[key]) products[key] = { name: item.name, barcode: item.barcode, photo: item.photo, dates: {} };
                    if (!products[key].dates[item.expiry]) products[key].dates[item.expiry] = [];
                    products[key].dates[item.expiry].push(item);
                    c.continue();
                } else { callback(products); }
            };
        }

        function exportToExcel() {
            if (!db) return;
            Swal.fire({ title: 'Exportando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            getGroupedData(products => {
                const excelData = [];
                for (const key in products) {
                    const p = products[key];
                    for (const date in p.dates) {
                        excelData.push({
                            "Producto": p.name,
                            "Código": p.barcode || "",
                            "Vencimiento": date,
                            "Cantidad": p.dates[date].length,
                            "Fecha Compra": p.dates[date][0].date
                        });
                    }
                }
                try {
                    const ws = XLSX.utils.json_to_sheet(excelData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Inventario");
                    XLSX.writeFile(wb, `Inventario_Despensa.xlsx`);
                    Swal.close();
                } catch (err) { Swal.fire('Error', 'No se pudo generar el archivo Excel.', 'error'); }
            });
        }

        // --- IMPORTACIÓN CON AUTO-RECUPERACIÓN DE FOTOS ---
        function importFromExcel(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = e => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                const tx = db.transaction(["inventory", "product_master"], "readwrite");
                
                json.forEach(row => {
                    const qty = parseInt(row["Cantidad"]) || 1;
                    const barcode = String(row["Código"] || "").trim();
                    const item = { 
                        name: row["Producto"], 
                        barcode: barcode, 
                        expiry: row["Vencimiento"], 
                        date: row["Fecha Compra"] || new Date().toLocaleDateString(), 
                        photo: PLACEHOLDER 
                    };
                    for(let i=0; i<qty; i++) { tx.objectStore("inventory").add({...item}); }
                    
                    // Si hay código, intentar recuperar foto de internet en segundo plano
                    if(barcode && barcode !== "") {
                        silentFetchPhoto(barcode);
                    }
                });
                tx.oncomplete = () => { 
                    Swal.fire("Importado", "Recuperando fotos de internet en segundo plano...", "success"); 
                    renderInventory(); 
                };
            };
            reader.readAsArrayBuffer(file);
        }

        async function silentFetchPhoto(barcode) {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                const d = await res.json();
                if (d.status === 1 && d.product.image_url) {
                    const photoUrl = d.product.image_url;
                    const tx = db.transaction(["inventory", "product_master"], "readwrite");
                    
                    // Actualizar memoria maestra
                    tx.objectStore("product_master").put({
                        barcode: barcode, 
                        name: d.product.product_name || "Producto", 
                        photo: photoUrl
                    });

                    // Actualizar todos los productos en inventario con este código que no tengan foto
                    const store = tx.objectStore("inventory");
                    store.openCursor().onsuccess = e => {
                        const cursor = e.target.result;
                        if(cursor) {
                            if(cursor.value.barcode === barcode && cursor.value.photo === PLACEHOLDER) {
                                const updateData = cursor.value;
                                updateData.photo = photoUrl;
                                cursor.update(updateData);
                            }
                            cursor.continue();
                        } else {
                            renderInventory(); // Refrescar UI al terminar
                        }
                    };
                }
            } catch(e) { console.log("Silent fetch failed for " + barcode); }
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const t = i18n[currentLang];
            const today = new Date().setHours(0,0,0,0);
            getGroupedData(products => {
                const finalData = [];
                for (const key in products) {
                    const p = products[key];
                    for (const date in p.dates) {
                        finalData.push({ ...p, expiry: date, qty: p.dates[date].length });
                    }
                }
                finalData.sort((a,b) => {
                    const isAExp = new Date(a.expiry) < today; const isBExp = new Date(b.expiry) < today;
                    if(isAExp && !isBExp) return -1; if(!isAExp && isBExp) return 1;
                    return new Date(a.expiry) - new Date(b.expiry);
                });
                const body = finalData.map(i => [i.name, i.barcode || "-", i.expiry, i.qty, new Date(i.expiry) < today ? t.pdf.expired : t.pdf.ok]);
                doc.text(t.pdf.title, 14, 20);
                doc.autoTable({ startY: 30, head: [[t.pdf.product, t.pdf.barcode, t.pdf.expiry, t.pdf.qty, t.pdf.status]], body: body, headStyles: { fillColor: [46, 125, 50] },
                    didParseCell: function(data) { if (data.row.raw && data.row.raw[4] === t.pdf.expired) { data.cell.styles.textColor = [211, 47, 47]; data.cell.styles.fillColor = [255, 235, 238]; } }
                });
                doc.save("Reporte_Despensa.pdf");
            });
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = ""; if (!db) return;
            const t = i18n[currentLang];
            getGroupedData(products => {
                for (const key in products) {
                    const p = products[key];
                    let total = 0; let submenu = "";
                    const sorted = Object.keys(p.dates).sort();
                    for (const date of sorted) {
                        const count = p.dates[date].length;
                        total += count;
                        const diff = Math.ceil((new Date(date) - new Date().setHours(0,0,0,0)) / (1000*60*60*24));
                        let style = "";
                        if (diff < 0) style = "alert-vencido"; else if (diff <= 3) style = "alert-3dias"; else if (diff <= 5) style = "alert-5dias";
                        submenu += `<button class="date-btn ${style}" onclick="openDetail('${p.name.replace(/'/g, "\\'")}', '${p.barcode || ""}', '${date}')">
                            <span>${date}</span><b>${count} ${t.units}</b></button>`;
                    }
                    const cleanId = key.replace(/[^a-z0-9]/gi, '');
                    list.innerHTML += `<div class="card">
                        <div class="card-header" onclick="toggleSubmenu('${cleanId}')">
                            <img src="${p.photo}" style="width:50px; height:50px; object-fit:cover; border-radius:8px; background:#eee;">
                            <div><strong>${p.name}</strong></div><span class="badge-count">${total}</span>
                        </div><div id="submenu-${cleanId}" class="submenu-dates">${submenu}</div></div>`;
                }
                if (list.innerHTML === "") list.innerHTML = `<p style='text-align:center; color:#888;'>${t.emptyPantry}</p>`;
            });
        }

        function toggleSubmenu(id) { const el = document.getElementById(`submenu-${id}`); if(el) el.classList.toggle('active'); }

        function openDetail(name, barcode, expiry) {
            const t = i18n[currentLang];
            const tx = db.transaction("inventory", "readonly");
            const matches = [];
            tx.objectStore("inventory").openCursor().onsuccess = e => {
                const c = e.target.result;
                if (c) {
                    const i = c.value;
                    if (i.name === name && (i.barcode || "") === barcode && i.expiry === expiry) matches.push(i);
                    c.continue();
                } else {
                    const p = matches[0];
                    const count = matches.length;
                    document.getElementById('detail-content').innerHTML = `
                        <img src="${p.photo}" style="width:100%; border-radius:10px; max-height:300px; object-fit:contain;">
                        <h2>${p.name}</h2><p><b>${t.available}:</b> ${count}</p><p><b>${t.details.expiry}:</b> ${p.expiry}</p>
                        <div class="qty-row"><span>${t.removeQty}:</span><input type="number" id="deleteQty" value="1" min="1" max="${count}" style="width:60px;"></div>
                        <button class="btn-main" style="background:var(--danger)" onclick="deleteMultiple('${name.replace(/'/g, "\\'")}', '${barcode}', '${expiry}')">${t.details.delete}</button>`;
                    showView('detail');
                }
            };
        }

        function deleteMultiple(name, barcode, expiry) {
            const qty = parseInt(document.getElementById('deleteQty').value);
            const tx = db.transaction("inventory", "readwrite");
            const store = tx.objectStore("inventory");
            let del = 0;
            store.openCursor().onsuccess = e => {
                const c = e.target.result;
                if (c && del < qty) {
                    const i = c.value;
                    if (i.name === name && (i.barcode || "") === barcode && i.expiry === expiry) { store.delete(c.key); del++; }
                    c.continue();
                } else { showView('home'); }
            };
        }

        function checkAlerts() {
            const list = document.getElementById('alerts-list'); list.innerHTML = "";
            const t = i18n[currentLang]; const today = new Date().setHours(0,0,0,0);
            getGroupedData(products => {
                for (const key in products) {
                    const p = products[key];
                    for (const date in p.dates) {
                        const count = p.dates[date].length;
                        const diff = Math.ceil((new Date(date) - today) / (1000 * 60 * 60 * 24));
                        let style = ""; let txt = "";
                        if (diff < 0) { style = "alert-vencido"; txt = t.expired; }
                        else if (diff <= 3) { style = "alert-3dias"; txt = t.expires3; }
                        else if (diff <= 5) { style = "alert-5dias"; txt = t.expires5; }
                        if (style) {
                            list.innerHTML += `<div class="card alert-item ${style}" onclick="openDetail('${p.name.replace(/'/g, "\\'")}', '${p.barcode || ""}', '${date}')">
                                <b>${txt} (${count} ${t.units})</b><br><span>${p.name}</span><br><small>${date}</small></div>`;
                        }
                    }
                }
            });
        }

        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            const idx = {home:0, add:1, alerts:2};
            if(id in idx) document.querySelectorAll('.nav-item')[idx[id]].classList.add('active');
            if(id === 'home') renderInventory();
            if(id === 'alerts') checkAlerts();
        }

        function showToolsMenu() {
            const t = i18n[currentLang];
            Swal.fire({
                title: t.toolsTitle, showConfirmButton: false,
                html: `
                    <button class="btn-main" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> ${t.expExcel}</button>
                    <button class="btn-main" onclick="document.getElementById('import-excel-input').click(); Swal.close();"><i class="fas fa-upload"></i> ${t.impExcel}</button>
                    <button class="btn-main" style="background:#607d8b" onclick="generatePDF()"><i class="fas fa-file-pdf"></i> ${t.genPdf}</button>`
            });
        }

        async function fetchProductInfo(barcode) {
            document.getElementById('api-loading').style.display = 'block';
            const tx = db.transaction("product_master", "readonly");
            const g = tx.objectStore("product_master").get(barcode); 
            g.onsuccess = async () => {
                if (g.result) {
                    document.getElementById('notes').value = g.result.name;
                    document.getElementById('current-photo-preview').src = g.result.photo;
                } else {
                    try {
                        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
                        const d = await res.json();
                        if (d.status === 1) {
                            document.getElementById('notes').value = d.product.product_name || "";
                            if(d.product.image_url) document.getElementById('current-photo-preview').src = d.product.image_url;
                        }
                    } catch(e) {}
                }
                document.getElementById('api-loading').style.display = 'none';
            };
        }

        function startScanner() {
            document.getElementById('scanner-container').style.display='block';
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                t => { document.getElementById('barcode').value = t; stopScanner(); fetchProductInfo(t); });
        }
        function stopScanner() { html5QrCode.stop(); document.getElementById('scanner-container').style.display='none'; }
    </script>
</body>
</html>
